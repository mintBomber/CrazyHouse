game:
  max_moves: 500         # Maximum half-moves before draw
  board_size: 8

ai:
  device: "cpu"          # "cuda" for GPU acceleration
  mcts_simulations: 25 #400  # Simulations per move
  gumbel_K: 8 #16           # Top-K candidates for Gumbel selection (root)
  c_puct: 1.25           # PUCT exploration constant (non-root nodes)
  dirichlet_alpha: 0.3   # Dirichlet noise alpha for root exploration
  dirichlet_eps: 0.25    # Fraction of Dirichlet noise added to root prior
  temperature: 1.0       # Sampling temperature (0 = greedy)
  temperature_threshold: 30   # After this many moves, use greedy selection
  value_scale: 1.0       # Scale factor for value head output

network:
  num_res_blocks: 3 #10     # Number of residual blocks
  channels: 64 #256          # Feature channels per layer
  policy_channels: 2     # Policy head intermediate channels
  value_channels: 1      # Value head intermediate channels
  value_fc_size: 128 #256     # Value head fully-connected hidden size
  input_planes: 28       # Number of input feature planes (see state encoding)

training:
  run_name: "run_quick_cpu" #"run_10000_games"           # Checkpoints are saved under checkpoints/{run_name}
  total_iterations: 20 #100        # Total training iterations for this run
  checkpoint_dir: "checkpoints" # Root checkpoint directory
  save_every_n_iters: 2 #10        # Save iter_XXXXX.pt every N iterations
  keep_last_n_checkpoints: 10    # 0 = keep all iter_XXXXX.pt files
  resume: true                  # Resume from checkpoints/{run_name}/latest.pt when present
  batch_size: 128 #256
  lr: 0.001
  lr_decay_steps: [100000, 300000]
  lr_decay_gamma: 0.1
  weight_decay: 0.0001
  num_self_play_games: 10 #100      # Self-play games per training iteration
  num_epochs: 3 #10                # Training epochs per iteration
  buffer_size: 20000 #100000           # Replay buffer capacity
  save_self_play_records: true      # Save each self-play game as JSON
  self_play_record_dir: "selfplay_records" # Saved under selfplay_records/{run_name}

ui:
  window_width: 1200
  window_height: 800
  # Board image is displayed at board_display_width wide, aspect-ratio preserved.
  # Original chess_board.png is 1602x1202 → scaled to 890x668 here.
  board_offset_x: 150    # Board image left edge in window
  board_offset_y: 50     # Board image top edge in window
  board_display_width: 890   # Board image rendered width (height auto from aspect ratio)
  # Exact 8x8 grid pixel boundaries measured from the 890x668 board image.
  # Each value is the LEFT/TOP edge of the corresponding column/row.
  # (Derived from direct pixel brightness analysis of chess_board.png at 890x668.)
  board_col_starts: [190, 254, 319, 383, 448, 512, 576, 641]
  board_row_starts: [76,  140, 205, 269, 334, 398, 463, 527]
  board_frame_right:  705   # x where the right decorative frame begins
  board_frame_bottom: 592   # y where the bottom decorative frame begins
  board_sq_size: 64         # piece sprite size (≈ square size, used for sprites & highlights)
  fps: 60
  animation_speed: 150   # Milliseconds per move animation
  hand_panel_x: 1060     # X position of hand panel
  hand_piece_size: 52    # Size of hand piece icons
  font_size: 22
  highlight_alpha: 160   # Transparency for highlights (0-255)
  colors:
    background: [40, 40, 40]
    panel_bg: [55, 55, 60]
    text: [230, 230, 230]
    text_secondary: [160, 160, 160]
    highlight_selected: [80, 200, 80]
    highlight_legal: [80, 150, 220]
    highlight_last_move: [220, 200, 60]
    highlight_check: [220, 50, 50]
    hand_selected: [200, 130, 30]
    button_normal: [70, 100, 140]
    button_hover: [90, 130, 180]
    button_text: [230, 230, 230]
